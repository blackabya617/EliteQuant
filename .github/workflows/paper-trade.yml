name: Paper trade

# Broker-free forward test. No API keys, no account, nothing to leak.
# Prices the simulated book against real closes, rebalances when the month
# turns, and commits the updated state so the record is auditable.

on:
  schedule:
    - cron: "15 21 * * 1-5"     # weekdays, after the US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/market-wizards-strategies-fbnhyz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: market_wizards_strategy
        run: pip install -q -r requirements.txt

      - name: Step the paper account
        working-directory: market_wizards_strategy
        run: python main.py run

      - name: Commit the updated record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_wizards_strategy/paper_state.json
          git diff --staged --quiet || git commit -m "paper: daily mark $(date -u +%Y-%m-%d)"
          git push
